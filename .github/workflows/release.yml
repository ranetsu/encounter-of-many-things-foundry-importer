name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./module.json').version")"
          test "$VERSION" = "$MANIFEST_VERSION"

      - name: Package module
        run: |
          npm ci
          npm run package

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            dist/encounter-of-many-things-importer.zip
